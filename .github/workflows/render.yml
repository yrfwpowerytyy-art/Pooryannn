name: Render Cold Earth Video

on:
  push:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render MP4
        run: npx remotion render src/index.ts ColdEarth out/cold-earth.mp4 --codec=h264
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: cold-earth-mp4
          path: out/cold-earth.mp4
          if-no-files-found: error
          retention-days: 7
